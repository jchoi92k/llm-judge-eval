[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evaluation-pipeline"
version = "0.1.0"
description = "LLM-as-judge evaluation pipeline for AI math-tutoring tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2==3.1.6",
    "openai==2.4.0",
    "pandas==2.3.3",
    "pillow==12.0.0",
    "python-dotenv==1.1.1",
    "tiktoken==0.12.0",
    "pydantic==2.11.7",
    "tqdm==4.67.1",
    "numpy==1.26.4",
    "requests==2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "jsonschema==4.25.1",
    "ruff==0.16.0",
]

[tool.setuptools]
packages = ["evaluation_pipeline"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Conservative rule set: errors, pyflakes, and import hygiene only.
# Style-only churn is deliberately avoided; expand once the refactor settles.
select = ["E", "F", "I"]
ignore = [
    "E501",  # long lines: templates/log messages exceed limits by design
    "E722",  # bare except: pre-existing in legacy paths; revisit deliberately
    "E741",  # ambiguous variable names (l): used in test one-liners
]

[tool.ruff.lint.isort]
known-first-party = ["evaluation_pipeline"]
